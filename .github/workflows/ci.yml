name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assert every route is statically prerendered
        run: |
          test -f .next/server/app/en.html || { echo "::error::/en was not prerendered"; exit 1; }
          test -f .next/server/app/es.html || { echo "::error::/es was not prerendered"; exit 1; }
          grep -q "Senior Full-Stack Engineer" .next/server/app/en.html \
            || { echo "::error::/en HTML is missing its content — SSG regressed"; exit 1; }
          grep -q "Ingeniero Full-Stack Senior" .next/server/app/es.html \
            || { echo "::error::/es HTML is missing its content — SSG regressed"; exit 1; }
          for lang in en es; do
            page=".next/server/app/$lang/packages/character.html"
            test -f "$page" \
              || { echo "::error::/$lang/packages/character was not prerendered"; exit 1; }
            grep -q "pcb-builder" "$page" \
              || { echo "::error::the builder is missing from $page"; exit 1; }
          done

      - name: Assert the character stays decorative
        run: |
          grep -q 'aria-hidden="true"' .next/server/app/en.html \
            || { echo "::error::the character is no longer hidden from assistive tech"; exit 1; }
